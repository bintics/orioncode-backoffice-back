# Application Configuration
spring.application.name=orioncode-backoffice

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# MySQL Database Configuration
# For production, use environment variables: ${DB_URL}, ${DB_USERNAME}, ${DB_PASSWORD}
spring.datasource.url=jdbc:mysql://localhost:3306/orioncode_backoffice?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Asegura que Hibernate cree las tablas antes de ejecutar data.sql (si se activa)
spring.jpa.defer-datasource-initialization=true
# No ejecutar data.sql automaticamente en este perfil para evitar duplicados
spring.sql.init.mode=never

# Logging Configuration
logging.level.com.orioncode.backoffice=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
