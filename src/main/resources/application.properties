# Application Configuration
spring.application.name=orioncode-backoffice

# Server Configuration
server.port=${PORT:8090}
server.servlet.context-path=/api

# MySQL Database Configuration
# For production, use environment variables: ${DB_URL}, ${DB_USERNAME}, ${DB_PASSWORD}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/orioncode_backoffice?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Asegura que Hibernate cree las tablas antes de ejecutar data.sql (si se activa)
spring.jpa.defer-datasource-initialization=true
# No ejecutar data.sql automaticamente en este perfil para evitar duplicados
spring.sql.init.mode=never

# Logging Configuration
logging.level.com.orioncode.backoffice=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# MCP Configuration (Spring AI MCP Server Boot Starter)
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=orioncode-backoffice-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.instructions=Servidor MCP para busqueda de colaboradores de OrionCode
spring.ai.mcp.server.base-url=/api
spring.ai.mcp.server.sse-endpoint=/mcp
spring.ai.mcp.server.sse-message-endpoint=/mcp/message

# Spring Security OAuth2 Resource Server Configuration
# URL del endpoint JWKS de auth-service para validar la firma de los tokens
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_SERVICE_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

