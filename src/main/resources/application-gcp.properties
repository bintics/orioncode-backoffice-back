# Application Configuration
spring.application.name=orioncode-backoffice

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api

# ==========================================
# MySQL & Cloud SQL Configuration
# ==========================================



# Configuración de DataSource (no modificar la URL, dejar localhost para Cloud SQL Proxy automático)
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:orioncode_backoffice}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Cloud SQL Socket Factory para conexión segura desde Cloud Run
spring.datasource.hikari.data-source-properties.cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME}
spring.datasource.hikari.data-source-properties.socketFactory=com.google.cloud.sql.mysql.SocketFactory
spring.datasource.hikari.data-source-properties.useSSL=false

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Dialecto actualizado para MySQL 8.4 (Instancia GCP)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# ==========================================
# Logging & Observability
# ==========================================
# Optimizamos para Cloud Run (Logs más limpios)
spring.main.banner-mode=off
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

logging.level.com.orioncode.backoffice=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# MCP Configuration (Spring AI MCP Server Boot Starter)
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=orioncode-backoffice-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.instructions=Servidor MCP para busqueda de colaboradores de OrionCode
spring.ai.mcp.server.base-url=/api
spring.ai.mcp.server.sse-endpoint=/mcp
spring.ai.mcp.server.sse-message-endpoint=/mcp/message
