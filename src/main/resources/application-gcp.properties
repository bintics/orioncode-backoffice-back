# Application Configuration
spring.application.name=orioncode-backoffice

# Server Configuration
server.port=8090
server.servlet.context-path=/api

# ==========================================
# MySQL & Cloud SQL Configuration
# ==========================================


# Configuración para Google Cloud SQL (Cloud Run)
spring.cloud.gcp.sql.instance-connection-name=${CLOUD_SQL_CONNECTION_NAME}
spring.cloud.gcp.sql.database-name=${DB_NAME:orioncode_backoffice}

# Configuración de DataSource (no modificar la URL, dejar localhost para Cloud SQL Proxy automático)
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:orioncode_backoffice}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Dialecto actualizado para MySQL 8.4 (Instancia GCP)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# ==========================================
# Logging & Observability
# ==========================================
# Optimizamos para Cloud Run (Logs más limpios)
spring.main.banner-mode=off
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

logging.level.com.orioncode.backoffice=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true