# Test Configuration
spring.application.name=orioncode-backoffice-test

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# No ejecutar data.sql en tests (mantener limpio y rápido)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# Logging Configuration for Tests
logging.level.com.orioncode.backoffice=DEBUG

# Spring Security OAuth2 Resource Server Configuration for Tests
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/.well-known/jwks.json
