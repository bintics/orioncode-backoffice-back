name: IDP backoffice

# 1. El Disparador
on:
  push:
    branches:
      - develop

env:
  PROJECT_ID: bintics-idp # Reemplaza con tu ID real
  SERVICE_NAME: backoffice-service
  REGION: us-central1 # O la región de GCP que prefieras

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 2. Descargar el código del repositorio
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 3. Configurar Java para correr las pruebas
      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21' # Cambia a '21' si usas esa versión
          distribution: 'temurin'
          cache: 'maven' # Usa 'gradle' si prefieres Gradle

      # 4. Validar que el código no esté roto (Pruebas Unitarias)
      - name: 🧪 Run Tests
        run: mvn test # O ./gradlew test

      # 5. Autenticarse con Google Cloud usando el Secreto
      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # 6. Desplegar la magia (Cloud Run + Buildpacks)
      ## --no-allow-unauthenticated
      ## --allow-unauthenticated
      - name: 🚀 Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --service-account="github-actions-cloud-runner@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --network=default \
            --subnet=default \
            --vpc-egress=private-ranges-only \
            --set-build-env-vars="GOOGLE_RUNTIME_VERSION=21" \
            --set-env-vars="SPRING_PROFILES_ACTIVE=prod,DB_HOST=10.128.0.2,SERVER_PORT=8080,DB_NAME=backoffice_service,LOGGING_LEVEL_ROOT=INFO" \
            --set-secrets="SPRING_DATASOURCE_USERNAME=DB_USER:latest,SPRING_DATASOURCE_PASSWORD=DB_PASS:latest" \
            --quiet